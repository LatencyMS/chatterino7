name: Build Custom Technorino

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: >-
            qtimageformats
            qt5compat
          cache: true

      - name: Install Conan
        run: pip install "conan==2.*"

      - name: Setup Conan profile
        run: conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-windows-msvc-${{ hashFiles('conanfile.py', 'conanfile.txt') }}
          restore-keys: conan-windows-msvc-

      - name: Install dependencies via Conan
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build
          Push-Location build
          conan install .. `
            -s build_type=Release `
            -s compiler.cppstd=20 `
            --build=missing `
            --output-folder=.
          Pop-Location

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="build/conan_toolchain.cmake" `
            -DCHATTERINO_PLUGINS=ON `
            -DBUILD_WITH_QTKEYCHAIN=OFF `
            -DCHATTERINO_LTO=OFF `
            -G "Ninja"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact
          $exe = Get-ChildItem -Recurse build -Filter chatterino.exe | Select-Object -First 1
          Copy-Item $exe.FullName artifact\chatterino.exe
          windeployqt --release --no-translations artifact\chatterino.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Technorino-Custom-Windows
          path: artifact\
          retention-days: 30
