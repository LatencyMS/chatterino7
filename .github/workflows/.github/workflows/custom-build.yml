name: Build Custom Technorino

on:
  workflow_dispatch:

env:
  CONAN_VERSION: 2.28.1

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          cache-key-prefix: Windows-QtCache-6.9.3-v2
          modules: qtimageformats
          version: "6.9.3"

      - name: Enable Developer Command Prompt
        uses: Chatterino/msvc-dev-cmd@v2.0.5
        with:
          arch: x64

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          key: Windows-x64-conan-${{ hashFiles('**/conanfile.py') }}-QT6
          path: ~/.conan2/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Conan
        shell: bash
        run: |
          pip install conan==${{ env.CONAN_VERSION }}
          conan profile detect -f

      - name: Create build directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path build

      - name: Install dependencies via Conan
        shell: bash
        working-directory: build
        run: |
          conan install .. \
            -s build_type=RelWithDebInfo \
            -c tools.cmake.cmaketoolchain:generator="Ninja" \
            -b missing \
            --output-folder=. \
            -o with_openssl3=True

      - name: Verify Conan output
        shell: pwsh
        run: |
          if (Test-Path "build/conan_toolchain.cmake") {
            Write-Host "SUCCESS: conan_toolchain.cmake found"
          } else {
            Write-Host "FAILURE: conan_toolchain.cmake not found!"
            Get-ChildItem build/ | Select-Object Name
            exit 1
          }

      - name: Configure CMake
        shell: pwsh
        working-directory: build
        run: |
          $toolchain = (Resolve-Path "conan_toolchain.cmake").Path
          Write-Host "Using toolchain: $toolchain"
          cmake -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            -DUSE_PRECOMPILED_HEADERS=ON `
            -DCHATTERINO_LTO=OFF `
            -DCHATTERINO_PLUGINS=ON `
            -DBUILD_WITH_QTKEYCHAIN=OFF `
            -DFORCE_JSON_GENERATION=Off `
            ..

      - name: Compile
        shell: pwsh
        working-directory: build
        run: ninja

      - name: Package
        shell: pwsh
        working-directory: build
        run: |
          windeployqt bin/chatterino.exe --release --no-compiler-runtime --no-translations --no-opengl-sw --dir Chatterino2/ --force-openssl
          Copy-Item bin/chatterino.exe Chatterino2/
          7z a Technorino-Custom-Windows.zip Chatterino2/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Technorino-Custom-Windows
          path: build/Technorino-Custom-Windows.zip
          retention-days: 30
